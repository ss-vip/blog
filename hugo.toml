baseURL = 'https://free.is-cool.dev/'
title = 'Free is cool 😎'
languageCode = 'zh-tw'
defaultContentLanguage = 'zh-tw'
theme = 'FixIt'
keywords = ['free', 'cool', 'easy', '免費', '很酷', '簡單', '好用']
ignoreLogs = ['warning-dev-version']

[sitemap]
  changefreq = 'weekly'
  priority = 0.5

[related]
  includeNewer = true
  threshold = 60
  toLower = true

[[related.indices]]
  name = 'categories'
  weight = 60

[[related.indices]]
  name = 'tags'
  weight = 30

[params]
  description = '免費很酷!蒐集網路免費簡單好用資訊,簡單乾淨的版面,不用很專業'
  default_theme = 'auto'
  word_count = false
  reading_time = false
  license = ''

[params.author]
  name = 'Admin'
  link = 'https://free.is-cool.dev/about'
  email = 'api@mail.ee'

[params.social]
  GitHub = 'ss-vip'
  Email = 'api@mail.ee'

[params.seo]
  # ponytail: 有預設 OG 圖後填入,例如 cover = '/images/og.png'
  cover = ''

[params.verification]
  google = 'google25a737ee848e6317'

[params.link]
  external_icon = true

[params.reading_progress]
  enable = true
  light = 'grey'
  dark = 'grey'

[params.app]
  svg_favicon = '/favicon.ico'

[params.header.title]
  typeit = true

[params.footer]
  author = false
  copyright = false

[params.github_corner]
  enable = true
  permalink = 'https://github.com/ss-vip'
  title = 'GitHub'

[params.back_to_top]
  enable = true
  scrollpercent = true

[params.cookieconsent]
  enable = false

[params.pace]
  enable = true
  color = 'pink'

[params.share]
  enable = false

[params.codeblock]
  max_shown_lines = 50

[params.json_viewer]
  enable = true
  expand_depth = 1
  copyable = true
  boxed = true

[markup]
  [markup.highlight]
    codeFences = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    style = 'tokyonight-day'
    tabWidth = 2

[markup.goldmark.renderer]
  unsafe = true

[menu]
  [[menu.main]]
    name = 'Free'
    url = '/categories/free/'
    pre = '<i class="fa-solid fa-tag"></i>'
    weight = 1
  [[menu.main]]
    name = 'Note'
    url = '/categories/note/'
    pre = '<i class="fa-solid fa-book"></i>'
    weight = 2
  [[menu.main]]
    name = 'About'
    url = '/about'
    pre = '<i class="fa-solid fa-circle-info"></i>'
    weight = 3
